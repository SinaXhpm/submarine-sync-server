; Submarine sync server — PHP settings in the Docker image.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
post_max_size = 6M
upload_max_filesize = 1M
file_uploads = Off
max_execution_time = 30
max_input_time = 30
memory_limit = 128M
allow_url_fopen = Off
session.use_strict_mode = 1
opcache.enable = 1
opcache.enable_cli = 0
