# Submarine sync server — the site. Only public/ is served; the rules in
# public/.htaccess apply (AllowOverride All).
<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/submarine/public

    <Directory /var/www/submarine/public>
        Options -Indexes -FollowSymLinks +SymLinksIfOwnerMatch
        AllowOverride All
        Require all granted
    </Directory>

    # The path only, never the query string: the apps send verification
    # codes as GET /auth/verify?token=..., and a log is no place for them.
    LogFormat "%a %t \"%m %U %H\" %>s %B %Dus" submarine
    CustomLog /proc/self/fd/1 submarine
    ErrorLog /proc/self/fd/2
</VirtualHost>
