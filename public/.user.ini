; Submarine sync server — PHP limits for hosts that read .user.ini (PHP-FPM, cPanel).
; Sync requests carry up to 4 MB of JSON.
post_max_size       = 6M
upload_max_filesize = 1M
file_uploads        = Off
max_execution_time  = 30
max_input_time      = 30
memory_limit        = 128M
display_errors      = Off
display_startup_errors = Off
log_errors          = On
